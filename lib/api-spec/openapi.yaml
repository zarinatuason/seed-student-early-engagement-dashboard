openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: SEED advisor review application API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: advisor
  - name: records
  - name: tracker
  - name: reference
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /reference:
    get:
      operationId: getReferenceGuide
      tags: [reference]
      summary: Get category, indicator, and dataset reference information
      responses:
        "200":
          description: Reference guide
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferenceGuide"
  /session:
    get:
      operationId: getSession
      responses:
        "200": { description: Current cookie-scoped advisor session, content: { application/json: { schema: { $ref: "#/components/schemas/SessionInfo" } } } }
    post:
      operationId: startSession
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SessionInput" } } } }
      responses:
        "201": { description: Separate new session, content: { application/json: { schema: { $ref: "#/components/schemas/SessionInfo" } } } }
  /session/resume:
    post:
      operationId: resumeSession
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ResumeSessionInput" } } } }
      responses:
        "200": { description: Resumed session, content: { application/json: { schema: { $ref: "#/components/schemas/SessionInfo" } } } }
  /session/reset:
    post:
      operationId: resetSession
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ResetSessionInput" } } } }
      responses:
        "200": { description: Only current session reset and examples restored, content: { application/json: { schema: { $ref: "#/components/schemas/SessionInfo" } } } }
  /session/date:
    put:
      operationId: setScenarioDate
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/DemoDateInput" } } } }
      responses:
        "200": { description: Scenario present, content: { application/json: { schema: { $ref: "#/components/schemas/DemoDate" } } } }
  /workspace/summary:
    get:
      operationId: getWorkspaceSummary
      responses:
        "200": { description: Academic and scoped workflow counts, content: { application/json: { schema: { $ref: "#/components/schemas/WorkspaceSummary" } } } }
  /workspace/records:
    get:
      operationId: listWorkspaceRecords
      parameters:
        - { $ref: "#/components/parameters/Search" }
        - { $ref: "#/components/parameters/Paper" }
        - { $ref: "#/components/parameters/Department" }
        - { $ref: "#/components/parameters/Category" }
        - { $ref: "#/components/parameters/ReviewFilter" }
        - { $ref: "#/components/parameters/ContactFilter" }
        - { $ref: "#/components/parameters/SortBy" }
        - { $ref: "#/components/parameters/SortDirection" }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
      responses:
        "200": { description: Records and distinct learner counts, content: { application/json: { schema: { $ref: "#/components/schemas/WorkspaceRecordsPage" } } } }
  /workspace/tracker:
    get:
      operationId: listWorkspaceTracker
      parameters:
        - { $ref: "#/components/parameters/Search" }
        - { $ref: "#/components/parameters/ReviewFilter" }
        - { $ref: "#/components/parameters/ContactFilter" }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
        - { name: followUp, in: query, schema: { type: string, enum: [all, due, overdue, open] } }
        - { name: supportProgress, in: query, schema: { $ref: "#/components/schemas/SupportProgress" } }
      responses:
        "200": { description: Reviews and support tracker, content: { application/json: { schema: { $ref: "#/components/schemas/WorkspaceRecordsPage" } } } }
  /workspace/records/{learnerId}/{courseCode}:
    get:
      operationId: getRecordWorkspace
      parameters:
        - { $ref: "#/components/parameters/LearnerId" }
        - { $ref: "#/components/parameters/CourseCode" }
      responses:
        "200": { description: Evidence and scoped workflow, content: { application/json: { schema: { $ref: "#/components/schemas/RecordWorkspace" } } } }
  /workspace/records/{learnerId}/{courseCode}/review:
    put:
      operationId: saveWorkspaceReview
      parameters:
        - { $ref: "#/components/parameters/LearnerId" }
        - { $ref: "#/components/parameters/CourseCode" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ReviewInput" } } } }
      responses:
        "200": { description: Saved review, content: { application/json: { schema: { $ref: "#/components/schemas/RecordWorkspace" } } } }
  /workspace/records/{learnerId}/{courseCode}/support-actions:
    post:
      operationId: createSupportAction
      parameters:
        - { $ref: "#/components/parameters/LearnerId" }
        - { $ref: "#/components/parameters/CourseCode" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SupportActionInput" } } } }
      responses:
        "201": { description: Saved action, content: { application/json: { schema: { $ref: "#/components/schemas/SupportAction" } } } }
  /workspace/support-actions/{actionId}:
    put:
      operationId: updateSupportAction
      parameters:
        - { name: actionId, in: path, required: true, schema: { type: string } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SupportActionInput" } } } }
      responses:
        "200": { description: Saved action, content: { application/json: { schema: { $ref: "#/components/schemas/SupportAction" } } } }
  /conversations:
    get:
      operationId: listConversations
      parameters:
        - { name: unreadOnly, in: query, schema: { type: boolean } }
        - { name: learnerId, in: query, schema: { type: string } }
      responses:
        "200": { description: Scoped inbox, content: { application/json: { schema: { $ref: "#/components/schemas/ConversationList" } } } }
    post:
      operationId: createConversation
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateConversationInput" } } } }
      responses:
        "201": { description: Exact saved outgoing message, content: { application/json: { schema: { $ref: "#/components/schemas/ConversationDetail" } } } }
  /conversations/{conversationId}:
    get:
      operationId: getConversation
      parameters:
        - { $ref: "#/components/parameters/ConversationId" }
      responses:
        "200": { description: Shared saved conversation, content: { application/json: { schema: { $ref: "#/components/schemas/ConversationDetail" } } } }
  /conversations/{conversationId}/messages:
    post:
      operationId: sendConversationMessage
      parameters:
        - { $ref: "#/components/parameters/ConversationId" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/MessageInput" } } } }
      responses:
        "201": { description: Idempotent simulated send, content: { application/json: { schema: { $ref: "#/components/schemas/ConversationDetail" } } } }
  /conversations/{conversationId}/read:
    post:
      operationId: markConversationRead
      parameters:
        - { $ref: "#/components/parameters/ConversationId" }
      responses:
        "200": { description: Reply read-state only updated, content: { application/json: { schema: { $ref: "#/components/schemas/ConversationDetail" } } } }
components:
  parameters:
    Search: { name: search, in: query, schema: { type: string } }
    Paper: { name: paper, in: query, schema: { type: string } }
    Department: { name: department, in: query, schema: { type: string } }
    Category: { name: category, in: query, schema: { $ref: "#/components/schemas/AcademicCategory" } }
    ReviewFilter: { name: reviewStatus, in: query, schema: { $ref: "#/components/schemas/ReviewStatus" } }
    ContactFilter: { name: contactStatus, in: query, schema: { $ref: "#/components/schemas/ContactStatus" } }
    SortBy: { name: sortBy, in: query, schema: { type: string, enum: [category, learnerId, paper, reason, reviewStatus] } }
    SortDirection: { name: sortDirection, in: query, schema: { type: string, enum: [asc, desc] } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: pageSize, in: query, schema: { type: integer, enum: [10, 25, 50], default: 10 } }
    LearnerId: { name: learnerId, in: path, required: true, schema: { type: string } }
    CourseCode: { name: courseCode, in: path, required: true, schema: { type: string } }
    ConversationId: { name: conversationId, in: path, required: true, schema: { type: string } }
  schemas:
    SessionInput:
      type: object
      properties:
        label: { type: string, minLength: 1, maxLength: 100 }
      required: [label]
    ResumeSessionInput:
      type: object
      properties:
        resumeCode: { type: string, minLength: 20, maxLength: 200 }
      required: [resumeCode]
    ResetSessionInput:
      type: object
      properties:
        confirm: { type: string, const: "RESET CURRENT SESSION" }
      required: [confirm]
    SessionInfo:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        resumeCode: { type: string }
        scenarioDate: { $ref: "#/components/schemas/DemoDate" }
        examples: { type: array, items: { $ref: "#/components/schemas/ExampleInfo" } }
      required: [id, label, resumeCode, scenarioDate, examples]
    ExampleInfo:
      type: object
      properties:
        learnerId: { type: string }
        courseCode: { type: string }
        conversationId: { type: string }
        label: { type: string }
      required: [learnerId, courseCode, conversationId, label]
    WorkspaceSummary:
      allOf:
        - { $ref: "#/components/schemas/AdvisorSummary" }
        - type: object
          properties:
            academicCategoryLearners: { $ref: "#/components/schemas/AcademicCategories" }
            unreadReplies: { type: integer }
            scheduledFollowUps: { type: integer }
            outstandingSupportActions: { type: integer }
            mixedCategoryLearners: { type: integer }
          required: [academicCategoryLearners, unreadReplies, scheduledFollowUps, outstandingSupportActions, mixedCategoryLearners]
    WorkspaceRecordSummary:
      allOf:
        - { $ref: "#/components/schemas/RecordSummary" }
        - type: object
          properties:
            supportActionCount: { type: integer }
            latestSupportAction: { type: ["string", "null"] }
            supportProgress: { type: ["string", "null"], enum: [Planned, In progress, Completed, Cancelled, null] }
            nextFollowUpDate: { type: ["string", "null"], format: date }
            outstandingFollowUpCount: { type: integer }
          required: [supportActionCount, latestSupportAction, supportProgress, nextFollowUpDate, outstandingFollowUpCount]
    WorkspaceRecordsPage:
      type: object
      properties:
        records: { type: array, items: { $ref: "#/components/schemas/WorkspaceRecordSummary" } }
        total: { type: integer }
        totalDistinctLearners: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        totalPages: { type: integer }
        categoryCounts: { $ref: "#/components/schemas/AcademicCategories" }
        categoryLearnerCounts: { $ref: "#/components/schemas/AcademicCategories" }
        countScope: { type: string }
      required: [records, total, totalDistinctLearners, page, pageSize, totalPages, categoryCounts, categoryLearnerCounts, countScope]
    RecordWorkspace:
      type: object
      properties:
        record: { $ref: "#/components/schemas/RecordDetail" }
        otherPapers: { type: array, items: { $ref: "#/components/schemas/RecordSummary" } }
        supportActions: { type: array, items: { $ref: "#/components/schemas/SupportAction" } }
        conversations: { type: array, items: { $ref: "#/components/schemas/ConversationSummary" } }
      required: [record, otherPapers, supportActions, conversations]
    SupportProgress:
      type: string
      enum: [Planned, In progress, Completed, Cancelled]
    SupportActionType:
      type: string
      enum: [Seek further context, Arrange a meeting, Provide academic guidance, Refer to a support service, Check in later, No further action at present]
    SupportActionInput:
      type: object
      properties:
        actionType: { $ref: "#/components/schemas/SupportActionType" }
        destination: { type: ["string", "null"], maxLength: 300 }
        details: { type: ["string", "null"], maxLength: 4000 }
        progress: { $ref: "#/components/schemas/SupportProgress" }
        followUpDate: { type: ["string", "null"], format: date }
        followUpCompleted: { type: boolean }
        effectiveDate: { type: string, format: date }
      required: [actionType, destination, details, progress, followUpDate, followUpCompleted, effectiveDate]
    SupportAction:
      allOf:
        - { $ref: "#/components/schemas/SupportActionInput" }
        - type: object
          properties:
            id: { type: string }
            learnerId: { type: string }
            courseCode: { type: string }
            offeringPeriod: { type: string }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
          required: [id, learnerId, courseCode, offeringPeriod, createdAt, updatedAt]
    CreateConversationInput:
      type: object
      properties:
        learnerId: { type: string }
        courseCodes: { type: array, minItems: 1, uniqueItems: true, items: { type: string } }
        subject: { type: string, minLength: 1, maxLength: 300 }
        body: { type: string, minLength: 1, maxLength: 10000 }
        clientMessageId: { type: string, minLength: 8, maxLength: 100 }
      required: [learnerId, courseCodes, subject, body, clientMessageId]
    MessageInput:
      type: object
      properties:
        subject: { type: string, minLength: 1, maxLength: 300 }
        body: { type: string, minLength: 1, maxLength: 10000 }
        clientMessageId: { type: string, minLength: 8, maxLength: 100 }
      required: [subject, body, clientMessageId]
    Message:
      type: object
      properties:
        id: { type: string }
        conversationId: { type: string }
        direction: { type: string, enum: [outgoing, incoming] }
        subject: { type: string }
        body: { type: string }
        scenarioDate: { type: string, format: date }
        savedAt: { type: string, format: date-time }
        read: { type: boolean }
        advisorLabel: { type: string }
        syntheticExample: { type: boolean }
      required: [id, conversationId, direction, subject, body, scenarioDate, savedAt, read, advisorLabel, syntheticExample]
    ConversationSummary:
      type: object
      properties:
        id: { type: string }
        learnerId: { type: string }
        subject: { type: string }
        courseCodes: { type: array, items: { type: string } }
        syntheticExample: { type: boolean }
        unreadCount: { type: integer }
        lastMessageDate: { type: string, format: date }
        lastIncomingDate: { type: ["string", "null"], format: date }
        messageCount: { type: integer }
      required: [id, learnerId, subject, courseCodes, syntheticExample, unreadCount, lastMessageDate, lastIncomingDate, messageCount]
    ConversationDetail:
      allOf:
        - { $ref: "#/components/schemas/ConversationSummary" }
        - type: object
          properties:
            messages: { type: array, items: { $ref: "#/components/schemas/Message" } }
            linkedRecords: { type: array, items: { $ref: "#/components/schemas/RecordSummary" } }
          required: [messages, linkedRecords]
    ConversationList:
      type: object
      properties:
        conversations: { type: array, items: { $ref: "#/components/schemas/ConversationSummary" } }
        unreadReplies: { type: integer }
      required: [conversations, unreadReplies]
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]
    AcademicCategory:
      type: string
      enum: [High Priority, Review Recommended, Insufficient Evidence, No Current Concern]
    ReviewStatus:
      type: string
      enum: [Awaiting review, In review, Reviewed]
    ContactStatus:
      type: string
      enum: [Not contacted, Awaiting response, Response received, No response recorded]
    ReviewOutcome:
      type: ["string", "null"]
      enum: [Further context needed, Follow-up planned, Support referral planned, No further action at present, null]
    AcademicCategories:
      type: object
      properties:
        highPriority: { type: integer }
        reviewRecommended: { type: integer }
        insufficientEvidence: { type: integer }
        noCurrentConcern: { type: integer }
      required: [highPriority, reviewRecommended, insufficientEvidence, noCurrentConcern]
    ReviewStatusTotals:
      type: object
      properties:
        awaitingReview: { type: integer }
        inReview: { type: integer }
        reviewed: { type: integer }
      required: [awaitingReview, inReview, reviewed]
    DemoDate:
      type: object
      properties:
        day: { type: integer, minimum: 29, maximum: 63 }
        week: { type: integer, minimum: 5, maximum: 9 }
        date: { type: string, format: date }
        dateLabel: { type: string }
        evidenceThrough: { type: string, format: date }
        evidenceDay: { type: integer, const: 28 }
      required: [day, week, date, dateLabel, evidenceThrough, evidenceDay]
    DemoDateInput:
      type: object
      properties:
        day: { type: integer, minimum: 29, maximum: 63 }
      required: [day]
    AdvisorSummary:
      type: object
      properties:
        learners: { type: integer }
        learnerPaperRecords: { type: integer }
        academicCategories: { $ref: "#/components/schemas/AcademicCategories" }
        reviewStatuses: { $ref: "#/components/schemas/ReviewStatusTotals" }
        followUpsDueToday: { type: integer }
        followUpsOverdue: { type: integer }
        demoDate: { $ref: "#/components/schemas/DemoDate" }
      required: [learners, learnerPaperRecords, academicCategories, reviewStatuses, followUpsDueToday, followUpsOverdue, demoDate]
    ReviewState:
      type: object
      properties:
        reviewStatus: { $ref: "#/components/schemas/ReviewStatus" }
        advisorNotes: { type: string }
        outcome: { $ref: "#/components/schemas/ReviewOutcome" }
        nextAction: { type: ["string", "null"] }
        followUpDate: { type: ["string", "null"], format: date }
        followUpCompleted: { type: boolean }
        contactStatus: { $ref: "#/components/schemas/ContactStatus" }
        lastUpdatedAt: { type: ["string", "null"], format: date-time }
        lastEffectiveDate: { type: ["string", "null"], format: date }
      required: [reviewStatus, advisorNotes, outcome, nextAction, followUpDate, followUpCompleted, contactStatus, lastUpdatedAt, lastEffectiveDate]
    RecordSummary:
      type: object
      properties:
        learnerId: { type: string }
        courseCode: { type: string }
        paperTitle: { type: string }
        facultySchool: { type: string }
        department: { type: string }
        category: { $ref: "#/components/schemas/AcademicCategory" }
        reason: { type: string }
        reviewStatus: { $ref: "#/components/schemas/ReviewStatus" }
        contactStatus: { $ref: "#/components/schemas/ContactStatus" }
        nextAction: { type: ["string", "null"] }
        followUpDate: { type: ["string", "null"], format: date }
        followUpCompleted: { type: boolean }
        lastUpdatedAt: { type: ["string", "null"], format: date-time }
      required: [learnerId, courseCode, paperTitle, facultySchool, department, category, reason, reviewStatus, contactStatus, nextAction, followUpDate, followUpCompleted, lastUpdatedAt]
    RecordsPage:
      type: object
      properties:
        records:
          type: array
          items: { $ref: "#/components/schemas/RecordSummary" }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        totalPages: { type: integer }
        categoryCounts: { $ref: "#/components/schemas/AcademicCategories" }
        countScope: { type: string }
      required: [records, total, page, pageSize, totalPages, categoryCounts, countScope]
    ResourceActivity:
      type: object
      properties:
        resourceTitle: { type: string }
        activityType: { type: string }
        availableFromDay: { type: integer }
        latestInteractionDay: { type: integer }
        interactionCount: { type: integer }
      required: [resourceTitle, activityType, availableFromDay, latestInteractionDay, interactionCount]
    LearningEvidence:
      type: object
      properties:
        eligibleResources: { type: integer }
        interactedResources: { type: integer }
        engagementCoverage: { type: ["number", "null"] }
        activeLearningDays: { type: integer }
        latestActivityDay: { type: ["number", "null"] }
        daysSinceLastActivity: { type: ["number", "null"] }
        concern: { type: boolean }
        resources:
          type: array
          items: { $ref: "#/components/schemas/ResourceActivity" }
      required: [eligibleResources, interactedResources, engagementCoverage, activeLearningDays, latestActivityDay, daysSinceLastActivity, concern, resources]
    AssessmentEvidence:
      type: object
      properties:
        assessmentId: { type: string }
        assessmentName: { type: string }
        category: { type: string }
        priorCredit: { type: boolean }
        availableFromDay: { type: integer }
        availableUntilDay: { type: ["integer", "null"] }
        learnerOpportunityDays: { type: integer }
        availabilityStatus: { type: string, enum: [Available during registered opportunity, Not yet available by Day 28, Availability ended before registration] }
        applicableDueDate: { type: ["string", "null"], format: date }
        dueDay: { type: ["integer", "null"] }
        dueState: { type: string, enum: [Due by Day 28, Not yet due, Prior credit, Not applicable] }
        submissionStatus: { type: string, enum: [Submitted, Not submitted by Day 28, Not yet due, Prior credit, No submission record] }
        submissionDate: { type: ["string", "null"], format: date }
        weightPercent: { type: number }
        result: { type: ["number", "null"] }
        resultAvailable: { type: boolean }
      required: [assessmentId, assessmentName, category, priorCredit, availableFromDay, availableUntilDay, learnerOpportunityDays, availabilityStatus, applicableDueDate, dueDay, dueState, submissionStatus, submissionDate, weightPercent, result, resultAvailable]
    AssessmentParticipation:
      type: object
      properties:
        dueCount: { type: integer }
        submittedCount: { type: integer }
        missedCount: { type: integer }
        submissionCompletionRate: { type: ["number", "null"] }
        weightedSubmissionCoverage: { type: ["number", "null"] }
        missedAssessmentWeight: { type: number }
        releasedResultCount: { type: integer }
        releasedAssessmentWeight: { type: number }
        weightedAverageAvailableScore: { type: ["number", "null"] }
        concern: { type: boolean }
        assessments:
          type: array
          items: { $ref: "#/components/schemas/AssessmentEvidence" }
      required: [dueCount, submittedCount, missedCount, submissionCompletionRate, weightedSubmissionCoverage, missedAssessmentWeight, releasedResultCount, releasedAssessmentWeight, weightedAverageAvailableScore, concern, assessments]
    LearnerContext:
      type: object
      properties:
        priorEducationLevel: { type: ["string", "null"] }
        previousAttemptCount: { type: ["integer", "null"] }
        creditLoad: { type: ["integer", "null"] }
      required: [priorEducationLevel, previousAttemptCount, creditLoad]
    HistoryEntry:
      type: object
      properties:
        id: { type: string }
        actionType: { type: string }
        effectiveDate: { type: string, format: date }
        savedAt: { type: string, format: date-time }
        method: { type: ["string", "null"] }
        note: { type: ["string", "null"] }
        summary: { type: string }
        academicCheckpoint: { type: string, format: date }
      required: [id, actionType, effectiveDate, savedAt, method, note, summary]
    RecordDetail:
      type: object
      properties:
        learnerId: { type: string }
        courseCode: { type: string }
        paperTitle: { type: string }
        facultySchool: { type: string }
        department: { type: string }
        courseLevel: { type: string }
        offeringPeriod: { type: string }
        paperStructureType: { type: string }
        category: { $ref: "#/components/schemas/AcademicCategory" }
        reason: { type: string }
        concernDomains: { type: array, items: { type: string } }
        registrationDay: { type: integer }
        opportunityDays: { type: integer }
        learning: { $ref: "#/components/schemas/LearningEvidence" }
        assessmentParticipation: { $ref: "#/components/schemas/AssessmentParticipation" }
        earlyPerformanceConcern: { type: boolean }
        learnerContext: { $ref: "#/components/schemas/LearnerContext" }
        review: { $ref: "#/components/schemas/ReviewState" }
        history:
          type: array
          items: { $ref: "#/components/schemas/HistoryEntry" }
      required: [learnerId, courseCode, paperTitle, facultySchool, department, courseLevel, offeringPeriod, paperStructureType, category, reason, concernDomains, registrationDay, opportunityDays, learning, assessmentParticipation, earlyPerformanceConcern, learnerContext, review, history]
    ReviewInput:
      type: object
      properties:
        reviewStatus: { $ref: "#/components/schemas/ReviewStatus" }
        advisorNotes: { type: string, maxLength: 4000 }
        outcome: { $ref: "#/components/schemas/ReviewOutcome" }
        nextAction: { type: ["string", "null"], maxLength: 500 }
        followUpDate: { type: ["string", "null"], format: date }
        followUpCompleted: { type: boolean }
        contactStatus: { $ref: "#/components/schemas/ContactStatus" }
        effectiveDate: { type: string, format: date }
      required: [reviewStatus, advisorNotes, outcome, nextAction, followUpDate, followUpCompleted, contactStatus, effectiveDate]
    ContactInput:
      type: object
      properties:
        method: { type: string, minLength: 1, maxLength: 80 }
        effectiveDate: { type: string, format: date }
        note: { type: string, maxLength: 2000 }
      required: [method, effectiveDate, note]
    ResponseInput:
      type: object
      properties:
        effectiveDate: { type: string, format: date }
        note: { type: string, maxLength: 2000 }
      required: [effectiveDate, note]
    TrackerPage:
      type: object
      properties:
        records:
          type: array
          items: { $ref: "#/components/schemas/RecordSummary" }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        totalPages: { type: integer }
      required: [records, total, page, pageSize, totalPages]
    CategoryGuide:
      type: object
      properties:
        category: { $ref: "#/components/schemas/AcademicCategory" }
        explanation: { type: string }
        count: { type: integer }
      required: [category, explanation, count]
    ReferenceGuide:
      type: object
      properties:
        categories:
          type: array
          items: { $ref: "#/components/schemas/CategoryGuide" }
        indicators:
          type: object
          additionalProperties: { type: string }
        evidenceCutoff: { type: string }
        syntheticData: { type: boolean }
        datasetChecks:
          type: array
          items: { type: string }
      required: [categories, indicators, evidenceCutoff, syntheticData, datasetChecks]

